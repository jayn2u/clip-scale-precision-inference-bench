[project]
name = "clip-precision-bench"
version = "0.1.0"
description = "CLIP model/precision inference benchmark on CUHK-PEDES text-to-image retrieval"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "numpy",
    "pillow",
    "ftfy",
    "regex",
    "tqdm",
    "packaging",
    "scipy",
    "clip",
]

[project.scripts]
clipbench = "clipbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipbench"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
